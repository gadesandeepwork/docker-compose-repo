<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Inventory</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Product Inventory</h1>
        <p>Add, view, and remove products from the database.</p>
      </header>
      <section>
        <h2>Add product</h2>
        <form id="product-form">
          <input id="product-name" placeholder="Product name" required />
          <input id="product-description" placeholder="Description" />
          <input id="product-price" type="number" min="0" step="0.01" placeholder="Price" required />
          <button type="submit">Add product</button>
        </form>
        <p id="message" role="status"></p>
      </section>
      <section>
        <h2>Products</h2>
        <div id="products"><p class="empty">Loading products...</p></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
